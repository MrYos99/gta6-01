<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEONFALL 2100 — a hover-car crime story in the neon city of Voltspire</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe3ff; font-family: system-ui, sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #debug { position: fixed; top: 8px; left: 8px; z-index: 5; font: 12px/1.5 monospace; color: #e8f4ff;
    background: rgba(10, 20, 35, 0.55); padding: 4px 8px; border-radius: 4px; pointer-events: none; }
  #title { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; color: #e8f4ff;
    background: linear-gradient(180deg, rgba(8, 18, 32, 0.55), rgba(8, 18, 32, 0.25) 45%, rgba(8, 18, 32, 0.65));
    cursor: pointer; }
  #title h1 { margin: 0; font-size: 64px; letter-spacing: 6px; color: #00f0ff;
    text-shadow: 0 0 24px rgba(0, 240, 255, 0.8), 0 2px 0 rgba(0,0,0,0.4); }
  #title h2 { margin: 8px 0 0; font-size: 20px; font-weight: 400; letter-spacing: 2px; color: #ffb300; }
  #title p { margin: 24px 0 0; font-size: 16px; line-height: 1.7; color: #dfeefc; max-width: 560px; }
  #title .start { margin-top: 28px; font-size: 18px; font-weight: 700; letter-spacing: 3px; color: #ff2d78;
    text-shadow: 0 0 16px rgba(255, 45, 120, 0.7); }
  #title .keys { margin-top: 16px; font-size: 13px; color: #8b93a3; }
</style>
<script type="importmap">
  { "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game" aria-label="NEONFALL 2100: walk the neon city of Voltspire"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="debug"></div>
<div id="title">
  <h1>NEONFALL 2100</h1>
  <h2>A HOVER-CAR CRIME STORY IN THE NEON CITY OF VOLTSPIRE</h2>
  <p>Kade Voss owes Helix Dynamics 50,000 credits. Six jobs to pay it off —
  starting with a stolen hover-car on a sun-soaked Neon Row street.</p>
  <div class="start">CLICK TO START</div>
  <div class="keys">WASD walk &nbsp;·&nbsp; Shift sprint &nbsp;·&nbsp; Space jump &nbsp;·&nbsp; Mouse orbit camera &nbsp;·&nbsp; P pause</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
